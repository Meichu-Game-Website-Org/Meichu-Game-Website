server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep redirects valid behind a TLS proxy or a published Docker port.
    absolute_redirect off;

    # The internal sharing service only receives a fixed Host and selected cache
    # validators. Browser credentials and arbitrary forwarded headers stay here.
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host meichu.games;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_set_header If-None-Match $http_if_none_match;
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 6s;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
    }

    location = / {
        return 308 /2026/$is_args$args;
    }

    location = /2026 {
        return 308 /2026/$is_args$args;
    }

    # Missing chunks must be a 404, not an HTML response cached as JavaScript.
    location ^~ /2026/assets/ {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /2026/sharing/ {
        try_files $uri =404;
    }

    location ^~ /sharing/ {
        try_files $uri =404;
    }

    # The service reads templates from disk; they are not public documents.
    location ~ ^/(2019|202[0-6])/_(game|news)(/|$) {
        internal;
        try_files $uri =404;
    }

    # All visitors receive the same initial HTML; there is no crawler UA branch.
    # The service validates the original URI again before choosing an API request.
    location ~ ^/(2019|202[0-6])/(game/[A-Za-z0-9_-]+|news/[0-9]+)/?$ {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8787;
    }

    location /og/ {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8787;
    }

    location ~ ^/2026/ {
        try_files $uri/index.html $uri $uri/ /2026/index.html;
    }

    # Only implemented archive years receive the archive's history fallback.
    location ~ ^/(?<archive_year>2019|202[0-5])(/|$) {
        try_files $uri/index.html $uri $uri/ /$archive_year/index.html;
    }

    # Includes unknown years and malformed numeric prefixes such as /20260.
    location ~ ^/[0-9]+(/|$) {
        return 404;
    }

    # Root-relative public archive files remain available without a cookie.
    location / {
        try_files $uri =404;
    }
}
