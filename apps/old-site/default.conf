server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep redirects valid behind a TLS proxy or a published Docker port.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 308 /2026/$is_args$args;
    }

    location = /2026 {
        return 308 /2026/$is_args$args;
    }

    # Missing chunks must be a 404, not an HTML response cached as JavaScript.
    location ^~ /2026/assets/ {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /2026/sharing/ {
        try_files $uri =404;
    }

    location ^~ /sharing/ {
        try_files $uri =404;
    }

    # Generated detail templates are only served through the validated routes below.
    location ~ ^/(2019|202[0-6])/_(game|news)(/|$) {
        internal;
        try_files $uri =404;
    }

    # Capture only characters safe in an HTML attribute. Never interpolate the Host,
    # query string, or an arbitrary request URI into the generated sharing metadata.
    location ~ ^/(?<share_year>2019|202[0-6])/game/(?<share_slug>[A-Za-z0-9_-]+)/?$ {
        set $share_url https://meichu.games/$share_year/game/$share_slug;
        try_files /$share_year/_game/index.html =404;
        sub_filter '__MEICHU_SHARE_URL__' $share_url;
        sub_filter_once off;
    }

    location ~ ^/(?<share_year>2019|202[0-6])/news/(?<share_news_id>[0-9]+)/?$ {
        set $share_url https://meichu.games/$share_year/news/$share_news_id;
        try_files /$share_year/_news/index.html =404;
        sub_filter '__MEICHU_SHARE_URL__' $share_url;
        sub_filter_once off;
    }

    location ~ ^/2026/ {
        try_files $uri/index.html $uri $uri/ /2026/index.html;
    }

    # Only implemented archive years receive the archive's history fallback.
    location ~ ^/(?<archive_year>2019|202[0-5])(/|$) {
        try_files $uri/index.html $uri $uri/ /$archive_year/index.html;
    }

    # Includes unknown years and malformed numeric prefixes such as /20260.
    location ~ ^/[0-9]+(/|$) {
        return 404;
    }

    # Root-relative public archive files remain available without a cookie.
    location / {
        try_files $uri =404;
    }
}
